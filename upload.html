<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Админка РКГДTUBE</title>
<meta name="robots" content="noindex">
<link rel="icon" href="media/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/admin.css">
</head>
<body>
<header>
  <div class="wrap">
    <div class="bar">
      <a class="logo" href="./"><img src="media/logo.jpg" alt=""><b>РКГД<span>TUBE</span></b></a>
      <span class="tag">Админка</span>
      <a class="btn" href="./" style="margin-left:auto">На сайт</a>
    </div>
  </div>
</header>

<main class="wrap admin">
  <!-- вход -->
  <section class="panel" id="login">
    <h1>Вход для админов</h1>
    <p class="muted">Введи свой ключ админа. Он выглядит так: <code>RCGD-XXXXX-XXXXX-XXXXX-XXXXX</code></p>
    <form id="loginForm" class="stack">
      <label for="key">Ключ</label>
      <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="RCGD-…" required>
      <label class="check"><input id="remember" type="checkbox"> Запомнить на этом устройстве</label>
      <button class="btn hot" type="submit" id="loginBtn">Войти</button>
      <p class="msg" id="loginMsg" role="status"></p>
    </form>
  </section>

  <!-- панель -->
  <section id="panel" hidden>
    <div class="who-row">
      <p>Ты вошёл с ключом <b id="keyNo"></b></p>
      <button class="btn" id="logout" type="button">Выйти</button>
    </div>

    <div class="cols">
      <form class="panel stack" id="addForm">
        <h2>Добавить видео</h2>
        <label for="url">Ссылка на видео YouTube</label>
        <input id="url" type="url" placeholder="https://youtu.be/…" required>
        <div class="preview" id="preview" hidden><img id="previewImg" alt=""></div>
        <label for="title">Название</label>
        <input id="title" type="text" maxlength="140" placeholder="Если пусто, возьмём с YouTube">
        <label for="author">Автор</label>
        <input id="author" type="text" maxlength="80" placeholder="Ник креатора">
        <label for="desc">Описание для поста в канале</label>
        <textarea id="desc" maxlength="700" placeholder="Если пусто, возьмём описание с YouTube"></textarea>
        <label for="tags">Хэштеги</label>
        <input id="tags" type="text" maxlength="120" placeholder="Например: gp_deco deco (хэштег автора добавится сам)">
        <button class="btn hot" type="submit" id="addBtn">Выложить на сайт</button>
        <p class="msg" id="addMsg" role="status"></p>
      </form>

      <form class="panel stack" id="hideForm">
        <h2>Скрыть видео с сайта</h2>
        <p class="muted">Для любого видео, даже если оно пришло из базы канала.</p>
        <label for="hideUrl">Ссылка на видео YouTube</label>
        <input id="hideUrl" type="url" placeholder="https://youtu.be/…" required>
        <button class="btn" type="submit" id="hideBtn">Скрыть</button>
        <p class="msg" id="hideMsg" role="status"></p>
      </form>
    </div>

    <section class="panel">
      <h2>Добавлено админами <span class="count" id="upCount"></span></h2>
      <div id="upList" class="items"><p class="muted">Загружаю…</p></div>
    </section>
    <section class="panel">
      <h2>Скрытые видео <span class="count" id="hidCount"></span></h2>
      <div id="hidList" class="items"></div>
    </section>
  </section>
</main>

<script src="assets/keys.js"></script>
<script src="assets/upload.js"></script>
</body>
</html>
