# Каждые 30 минут берёт свежую базу ворков и обновляет сайт.
name: Обновить сайт

on:
  schedule:
    - cron: "7,37 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Собрать список видео из базы
        run: |
          pip install requests==2.32.3
          python scripts/build_data.py

      - name: Убрать файлы старой версии сайта
        run: |
          find media -type f ! -name logo.jpg -delete 2>/dev/null || true
          rm -f scripts/fetch_posts.py

      - name: Сохранить список в репозиторий
        run: |
          git config user.name "rcgdtube-bot"
          git config user.email "rcgdtube-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Обновлён список видео"
          git pull --rebase --autostash || true
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
